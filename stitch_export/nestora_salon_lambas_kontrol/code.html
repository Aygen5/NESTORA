  </head><body class="bg-surface-container-lowest text-on-surface antialiased"><header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/90 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.03)]"><div class="h-16 px-margin flex items-center justify-between gap-space-sm"><div class="flex items-center min-w-0"><button aria-label="Geri" class="w-11 h-11 flex items-center justify-center -ml-2 text-on-surface hover:text-primary-container transition-colors rounded-full active:scale-95" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface truncate ml-1">Nestora   Aydınlatma Kontrolü</h1></div><div class="flex items-center gap-space-xs"><button aria-label="Favorilere Ekle" class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary-container transition-colors rounded-full active:scale-95" type="button"><span class="material-symbols-outlined text-[22px]">favorite</span></button><button aria-label="Düzenle" class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary-container transition-colors rounded-full active:scale-95" type="button"><span class="material-symbols-outlined text-[22px]">edit</span></button><button aria-label="Sil" class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-error transition-colors rounded-full active:scale-95" type="button"><span class="material-symbols-outlined text-[22px]">delete</span></button></div></div></header><main class="relative w-full min-h-screen pt-16 pb-safe bg-surface-container-lowest px-margin"><div class="flex flex-col w-full pb-8">
<div class="flex flex-col w-full gap-space-md">

<!-- Center Filament Radiance Node -->

</div>

<div class="relative z-10 mt-5 flex items-center justify-between w-full max-w-[280px] bg-surface-container-low px-4 py-2.5 rounded-full">

<div class="flex items-center justify-between">

<div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-primary">

</div>
<div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Parlaklık</h2>
<p class="font-body-sm text-body-sm text-secondary">Aydınlatma şiddeti</p>
</div>
</div>
<span class="font-headline-lg text-headline-lg text-primary tracking-tight" id="brightnessValue">%72</span>
</div>
<!-- Custom Touch Track Range Slider -->
<div class="relative w-full py-2">
<div class="relative w-full h-4 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full transition-[width] duration-150" id="sliderTrackFill" style="width: 72%;"></div>
</div>
<input aria-label="Parlaklık Değeri" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" id="brightnessRange" max="100" min="1" type="range" value="72"/>
</div>
<!-- Quick Preset Pills -->
<div class="grid grid-cols-4 gap-2 pt-1">
<button class="preset-pill py-2 text-center rounded-full bg-surface-container-low text-on-surface font-label-md text-label-md transition-all active:scale-95 hover:bg-surface-container" onclick="setBrightness(25)" type="button">
          %25
        </button>
<button class="preset-pill py-2 text-center rounded-full bg-surface-container-low text-on-surface font-label-md text-label-md transition-all active:scale-95 hover:bg-surface-container" onclick="setBrightness(50)" type="button">
          %50
        </button>
<button class="preset-pill py-2 text-center rounded-full bg-primary-container text-on-primary font-label-md text-label-md transition-all active:scale-95 shadow-sm" onclick="setBrightness(75)" type="button">
          %75
        </button>
<button class="preset-pill py-2 text-center rounded-full bg-surface-container-low text-on-surface font-label-md text-label-md transition-all active:scale-95 hover:bg-surface-container" onclick="setBrightness(100)" type="button">
          %100
        </button>
</div>
</div>
<!-- Color Temperature & Atmosphere Swatches -->
<div class="flex flex-col bg-surface-container-lowest p-5 rounded-xl shadow-sm gap-space-md">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[20px]">palette</span>
</div>
<div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Renk Sıcaklığı &amp; Ton</h2>
<p class="font-body-sm text-body-sm text-secondary" id="activeColorName">Sıcak Günışığı (2700K)</p>
</div>
</div>
</div>
<!-- Swatch Circles Palette -->
<div class="flex items-center justify-between px-1">
<!-- 1. Warm Amber (Selected) -->
<button aria-label="Sıcak Günışığı 2700K" class="color-swatch-btn relative group p-1 flex items-center justify-center" onclick="selectColor(this, 'Sıcak Günışığı (2700K)', '#E1C1A0', '#FFF8F0')" type="button">
<span class="w-11 h-11 rounded-full bg-tertiary-fixed-dim flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[18px] text-on-tertiary-container check-icon">check</span>
</span>
<span class="swatch-indicator absolute -inset-0.5 rounded-full ring-2 ring-primary-container"></span>
</button>
<!-- 2. Natural White (4000K) -->
<button aria-label="Doğal Beyaz 4000K" class="color-swatch-btn relative group p-1 flex items-center justify-center" onclick="selectColor(this, 'Doğal Beyaz (4000K)', '#EAF0E6', '#F5FBF2')" type="button">
<span class="w-11 h-11 rounded-full bg-surface-container-highest flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[18px] text-on-surface hidden check-icon">check</span>
</span>
<span class="swatch-indicator absolute -inset-0.5 rounded-full ring-2 ring-transparent"></span>
</button>
<!-- 3. Cold White (6500K) -->
<button aria-label="Soğuk Beyaz 6500K" class="color-swatch-btn relative group p-1 flex items-center justify-center" onclick="selectColor(this, 'Soğuk Beyaz (6500K)', '#D3E8D5', '#FFFFFF')" type="button">
<span class="w-11 h-11 rounded-full bg-primary-fixed flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[18px] text-on-primary-fixed hidden check-icon">check</span>
</span>
<span class="swatch-indicator absolute -inset-0.5 rounded-full ring-2 ring-transparent"></span>
</button>
<!-- 4. Soft Sage Green -->
<button aria-label="Soft Adaçayı Yeşili" class="color-swatch-btn relative group p-1 flex items-center justify-center" onclick="selectColor(this, 'Soft Adaçayı Yeşili', '#506354', '#EFF5EC')" type="button">
<span class="w-11 h-11 rounded-full bg-secondary-fixed-dim flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[18px] text-on-secondary-fixed hidden check-icon">check</span>
</span>
<span class="swatch-indicator absolute -inset-0.5 rounded-full ring-2 ring-transparent"></span>
</button>
<!-- 5. Night Ember Mode -->
<button aria-label="Gece Modu" class="color-swatch-btn relative group p-1 flex items-center justify-center" onclick="selectColor(this, 'Gece Modu (Köz)', '#533E25', '#FAF3EB')" type="button">
<span class="w-11 h-11 rounded-full bg-tertiary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[18px] text-on-tertiary-container hidden check-icon">check</span>
</span>
<span class="swatch-indicator absolute -inset-0.5 rounded-full ring-2 ring-transparent"></span>
</button>
</div>
</div>
<!-- Management & Destructive Action Bar -->
<div class="flex flex-col gap-space-sm pt-2">
<!-- Edit Device (Primary Button) -->
<button class="w-full h-[52px] rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-sm transition-transform active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-[20px]">tune</span>
<span>Cihazı Yapılandır</span>
</button>
<!-- Delete Device (Subtle Destructive Ghost/Secondary) -->
<button class="w-full h-12 rounded-full bg-surface-container-low text-error hover:bg-error-container/40 font-label-lg text-label-lg flex items-center justify-center gap-2 transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined text-[18px]">delete_outline</span>
<span>Cihazı Kaldır</span>
</button>
</div>
</div>

<script>
  (function() {
    let isOn = true;
    let currentBrightness = 72;

    const toggleBtn = document.getElementById('masterToggleBtn');
    const toggleKnob = document.getElementById('toggleKnob');
    const powerLabel = document.getElementById('powerStatusLabel');
    const headerStatus = document.getElementById('headerStatusText');
    const ambientGlow = document.getElementById('ambientGlow');
    const bulbGlass = document.getElementById('bulbGlassPath');
    const bulbFilament = document.getElementById('bulbFilament');
    const filamentDot = document.getElementById('filamentDot');
    const lightRays = document.getElementById('lightRays');
    const slider = document.getElementById('brightnessRange');
    const sliderFill = document.getElementById('sliderTrackFill');
    const brightnessText = document.getElementById('brightnessValue');
    const powerIndicatorIcon = document.getElementById('powerIndicatorIcon');

    function updateBulbVisuals() {
      if (!isOn) {
        // OFF state
        toggleKnob.className = 'w-6 h-6 rounded-full bg-on-primary shadow-md transform translate-x-0 transition-transform duration-300';
        toggleBtn.className = 'w-14 h-8 rounded-full bg-surface-container-highest p-1 transition-all duration-300 relative flex items-center shadow-inner';
        powerLabel.textContent = 'Kapalı';
        powerLabel.className = 'font-headline-sm text-headline-sm text-outline font-semibold';
        headerStatus.textContent = 'Kapalı';
        powerIndicatorIcon.className = 'material-symbols-outlined text-[20px] text-outline';
        
        ambientGlow.style.opacity = '0';
        bulbGlass.setAttribute('fill', '#E4EAE1');
        bulbFilament.setAttribute('stroke', '#C3C8C1');
        filamentDot.setAttribute('fill', '#C3C8C1');
        lightRays.style.opacity = '0';
      } else {
        // ON state
        toggleKnob.className = 'w-6 h-6 rounded-full bg-on-primary shadow-md transform translate-x-6 transition-transform duration-300';
        toggleBtn.className = 'w-14 h-8 rounded-full bg-primary-container p-1 transition-all duration-300 relative flex items-center shadow-inner';
        powerLabel.textContent = 'Açık';
        powerLabel.className = 'font-headline-sm text-headline-sm text-on-surface font-semibold';
        headerStatus.textContent = 'Açık • %' + currentBrightness;
        powerIndicatorIcon.className = 'material-symbols-outlined text-[20px] text-primary';
        
        const opacityLevel = Math.max(0.2, currentBrightness / 100);
        ambientGlow.style.opacity = opacityLevel.toString();
        ambientGlow.style.transform = `scale(${0.7 + (currentBrightness / 200)})`;
        lightRays.style.opacity = (currentBrightness > 20) ? '1' : '0.2';
      }
    }

    toggleBtn.addEventListener('click', function() {
      isOn = !isOn;
      updateBulbVisuals();
    });

    slider.addEventListener('input', function(e) {
      currentBrightness = parseInt(e.target.value, 10);
      sliderFill.style.width = currentBrightness + '%';
      brightnessText.textContent = '%' + currentBrightness;
      if (!isOn && currentBrightness > 0) {
        isOn = true;
      }
      updateBulbVisuals();
    });

    window.setBrightness = function(val) {
      currentBrightness = val;
      slider.value = val;
      sliderFill.style.width = val + '%';
      brightnessText.textContent = '%' + val;
      if (!isOn) isOn = true;
      updateBulbVisuals();

      // Refresh preset pill highlights
      document.querySelectorAll('.preset-pill').forEach(pill => {
        if (pill.textContent.trim() === '%' + val) {
          pill.className = 'preset-pill py-2 text-center rounded-full bg-primary-container text-on-primary font-label-md text-label-md transition-all active:scale-95 shadow-sm';
        } else {
          pill.className = 'preset-pill py-2 text-center rounded-full bg-surface-container-low text-on-surface font-label-md text-label-md transition-all active:scale-95 hover:bg-surface-container';
        }
      });
    };

    window.selectColor = function(buttonElement, name, filamentColor, glassColor) {
      document.getElementById('activeColorName').textContent = name;
      
      // Update Swatch Indicators
      document.querySelectorAll('.color-swatch-btn').forEach(btn => {
        const check = btn.querySelector('.check-icon');
        const indicator = btn.querySelector('.swatch-indicator');
        if (check) check.classList.add('hidden');
        if (indicator) {
          indicator.classList.remove('ring-primary-container');
          indicator.classList.add('ring-transparent');
        }
      });

      const currentCheck = buttonElement.querySelector('.check-icon');
      const currentIndicator = buttonElement.querySelector('.swatch-indicator');
      if (currentCheck) currentCheck.classList.remove('hidden');
      if (currentIndicator) {
        currentIndicator.classList.remove('ring-transparent');
        currentIndicator.classList.add('ring-primary-container');
      }

      if (isOn) {
        bulbFilament.setAttribute('stroke', filamentColor);
        filamentDot.setAttribute('fill', filamentColor);
        bulbGlass.setAttribute('fill', glassColor);
      }
    };
  })();
</script></main></body></html>
