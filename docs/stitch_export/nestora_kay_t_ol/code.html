<!DOCTYPE html>

<html lang="tr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,300..900;1,6..12,300..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;background-color:#ffffff;}body{overscroll-behavior-y:none;font-family:'Nunito Sans',sans-serif;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { colors: { 'surface-container-highest': '#dee4db', 'outline': '#737872', 'primary-fixed': '#d3e8d5', 'secondary-fixed-dim': '#c0c9bc', 'on-error-container': '#93000a', 'on-error': '#ffffff', 'on-secondary': '#ffffff', 'secondary-fixed': '#dce5d7', 'inverse-on-surface': '#edf2e9', 'on-surface-variant': '#434843', 'outline-variant': '#c3c8c1', 'on-primary-fixed-variant': '#394b3d', 'on-primary-container': '#9fb3a1', 'primary-container': '#344638', 'surface-tint': '#506354', 'on-tertiary': '#ffffff', 'on-tertiary-fixed-variant': '#58432a', 'background': '#f5fbf2', 'on-secondary-container': '#5e675c', 'error': '#ba1a1a', 'inverse-primary': '#b7ccb9', 'on-primary': '#ffffff', 'on-secondary-fixed-variant': '#41493f', 'tertiary-container': '#533e25', 'on-tertiary-fixed': '#291804', 'on-surface': '#171d18', 'inverse-surface': '#2c322c', 'on-background': '#171d18', 'surface-variant': '#dee4db', 'surface-container-low': '#eff5ec', 'tertiary-fixed-dim': '#e1c1a0', 'surface-container-high': '#e4eae1', 'error-container': '#ffdad6', 'surface': '#f5fbf2', 'secondary-container': '#dce5d7', 'tertiary': '#3b2811', 'primary-fixed-dim': '#b7ccb9', 'surface-bright': '#f5fbf2', 'secondary': '#586156', 'surface-container-lowest': '#ffffff', 'on-secondary-fixed': '#161e15', 'on-primary-fixed': '#0e1f13', 'on-tertiary-container': '#c7a98a', 'surface-dim': '#d6dcd3', 'surface-container': '#eaf0e6', 'tertiary-fixed': '#feddbb', 'primary': '#1e3023' }, borderRadius: { 'DEFAULT': '0.25rem', 'lg': '0.5rem', 'xl': '0.75rem', 'full': '9999px' }, spacing: { 'space-xs': '0.25rem', 'gutter': '1rem', 'margin': '1.25rem', 'space-sm': '0.5rem', 'space-md': '1rem', 'space-lg': '1.5rem', 'space-xl': '2rem' }, fontFamily: { 'headline-lg': ['Nunito Sans'], 'label-md': ['Nunito Sans'], 'label-sm': ['Nunito Sans'], 'headline-md': ['Nunito Sans'], 'headline-xl': ['Nunito Sans'], 'body-sm': ['Nunito Sans'], 'label-lg': ['Nunito Sans'], 'headline-sm': ['Nunito Sans'], 'body-lg': ['Nunito Sans'], 'body-md': ['Nunito Sans'] }, fontSize: { 'headline-lg': ['26px', { lineHeight: '34px', letterSpacing: '-0.015em', fontWeight: '700' }], 'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.02em', fontWeight: '600' }], 'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.04em', fontWeight: '700' }], 'headline-md': ['20px', { lineHeight: '28px', letterSpacing: '-0.01em', fontWeight: '600' }], 'headline-xl': ['34px', { lineHeight: '42px', letterSpacing: '-0.02em', fontWeight: '700' }], 'body-sm': ['12px', { lineHeight: '16px', fontWeight: '400' }], 'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0.01em', fontWeight: '600' }], 'headline-sm': ['17px', { lineHeight: '24px', fontWeight: '600' }], 'body-lg': ['16px', { lineHeight: '24px', fontWeight: '400' }], 'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }] } } } }</script></head><body class="bg-surface-container-lowest text-on-surface antialiased pt-safe pb-safe min-h-screen"><main class="relative w-full min-h-screen bg-surface-container-lowest"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Top Navigation & Brand Header -->
<div class="flex items-center justify-between pt-space-md pb-space-sm">
<button aria-label="Geri dön" class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary transition-transform active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span>
</button>
<div class="flex items-center gap-1.5">
<img alt="Nestora Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjwXv-wjVHROMlVbf4pc8X9MQqgWnkYD21cJ9GU6G1RyomsxGjJdnIPXBAgoGNLoHaw7tlcD5gmMoa2O0_JH83NG715BKUsCehW79p4zQfW5hSQIuW0CZfkY8JiQwa0qNUJGOyZcDXZDEVHj_6Y4D3x2QrMwuqYAu2rJSvH8grbwLR-zKmktYLL5-s570HNQ4DCZgqMGMyMtbcxKAEcdYoVbdVNiM3NGvbVX51b7g"/>
<span class="font-headline-sm text-headline-sm text-primary font-bold tracking-tight">Nestora</span>
</div>
<div class="w-10"></div>
</div>
<!-- Editorial Headline Section -->
<div class="mt-space-lg mb-space-lg">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-secondary-fixed text-primary mb-space-sm">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">eco</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Doğal Akıllı Yaşam</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">
      Aramıza Katıl
    </h1>
<p class="font-body-md text-body-md text-secondary mt-1">
      Nestora ile evini yönetmeye başla.
    </p>
</div>
<!-- Register Form Card -->
<form class="flex flex-col gap-space-md" id="register-form" onsubmit="event.preventDefault();">
<!-- Ad Soyad Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-primary font-semibold" for="name">
        Ad Soyad
      </label>
<div class="relative flex items-center rounded-xl bg-surface-container-low transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-[20px] pointer-events-none">person</span>
<input class="w-full h-12 pl-11 pr-4 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline rounded-xl outline-none" id="name" placeholder="Aygen Yıldırım" required="" type="text"/>
</div>
</div>
<!-- E-posta Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-primary font-semibold" for="email">
        E-posta
      </label>
<div class="relative flex items-center rounded-xl bg-surface-container-low transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-[20px] pointer-events-none">mail</span>
<input class="w-full h-12 pl-11 pr-4 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline rounded-xl outline-none" id="email" placeholder="aygen@example.com" required="" type="email"/>
</div>
</div>
<!-- Şifre Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-primary font-semibold" for="password">
        Şifre
      </label>
<div class="relative flex items-center rounded-xl bg-surface-container-low transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-[20px] pointer-events-none">lock</span>
<input class="w-full h-12 pl-11 pr-12 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline rounded-xl outline-none" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Şifreyi Göster/Gizle" class="absolute right-3 w-8 h-8 flex items-center justify-center text-secondary hover:text-primary transition-colors" onclick="toggleVisibility('password', 'pwd-icon-1')" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon-1">visibility</span>
</button>
</div>
</div>
<!-- Şifre Tekrar Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-primary font-semibold" for="password-confirm">
        Şifre Tekrar
      </label>
<div class="relative flex items-center rounded-xl bg-surface-container-low transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-[20px] pointer-events-none">verified_user</span>
<input class="w-full h-12 pl-11 pr-12 bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline rounded-xl outline-none" id="password-confirm" placeholder="••••••••" required="" type="password"/>
<button aria-label="Şifre Tekrarını Göster/Gizle" class="absolute right-3 w-8 h-8 flex items-center justify-center text-secondary hover:text-primary transition-colors" onclick="toggleVisibility('password-confirm', 'pwd-icon-2')" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon-2">visibility</span>
</button>
</div>
</div>
<!-- Terms and Eco Commitment Note -->
<div class="flex items-start gap-2.5 pt-1">
<label class="relative flex items-center justify-center w-5 h-5 mt-0.5 rounded bg-surface-container-low cursor-pointer flex-shrink-0">
<input checked="" class="peer sr-only" id="terms-check" type="checkbox"/>
<div class="w-5 h-5 rounded bg-surface-container-highest peer-checked:bg-primary-container flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-[14px] text-on-primary">check</span>
</div>
</label>
<label class="font-body-sm text-body-sm text-secondary select-none cursor-pointer" for="terms-check">
<span>Kullanım Koşulları</span>'nı ve <span>Sürdürülebilir Ev Politikası</span>'nı onaylıyorum.
      </label>
</div>
<!-- Submit Primary Button -->
<div class="pt-space-sm">
<button class="w-full h-[52px] bg-primary-container text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-transform" type="submit">
<span>Hesap Oluştur</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Ambient Micro-feature Pill -->
<div class="my-space-lg p-space-md rounded-xl bg-surface-container-low flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-fixed flex items-center justify-center text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[22px]">energy_savings_leaf</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-primary font-semibold truncate">Daha Yeşil Bir Ev</span>
<span class="font-body-sm text-body-sm text-secondary line-clamp-1">Kurulum sonrası %28'e varan enerji tasarrufu.</span>
</div>
</div>
<!-- Footer Account Switch Prompt -->
<div class="flex items-center justify-center gap-1.5 pt-space-xs text-center">
<span class="font-body-md text-body-md text-secondary">Zaten hesabın var mı?</span>
<a class="font-label-lg text-label-lg text-primary-container font-bold hover:underline" href="#">
      Giriş Yap
    </a>
</div>
</div>
<script>
  function toggleVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }
</script></main></body></html>
